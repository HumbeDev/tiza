[package]
name = "tiza"
version = "0.2.0"
description = "Offline presentation editor with LaTeX, media and HTML simulations"
authors = ["Humberto Daniel Lage Rodríguez <humbertodlr96@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HumbeDev/tiza"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tiza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
sha2 = "0.11.1"
imagesize = "0.15.0"
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time", "macros"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.0", features = ["v4"] }
toml_edit = "0.25.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
